name: release

# Tag-triggered release. A tag of v* produces a release with the source tree
# and the changelog section for that version as the release body.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Extract the changelog section
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          marker = f"## [{version}]"
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next((index for index, line in enumerate(lines) if line.startswith(marker)), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          end = next(
              (index for index in range(start + 1, len(lines)) if lines[index].startswith("## [")),
              len(lines),
          )
          body = "\n".join(lines[start + 1:end]).strip() + "\n"
          Path("RELEASE_NOTES.md").write_text(body, encoding="utf-8")
          PY

      - name: Verify the build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend
          npm run check --prefix frontend
          npm run build --prefix frontend
          python -m pytest

      - name: Package the source tree
        run: |
          git archive --format=tar.gz --prefix="shityo-${VERSION}/" -o "shityo-${VERSION}.tar.gz" "$GITHUB_SHA"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: shityo-${{ steps.version.outputs.version }}.tar.gz
