# Паспорт основы «Бралетт». Формулы - в app.drafts.lingerie.build_bralette;
# порядок полей и значения - контракт с интерфейсом (docs/BLOCKS.md).

id = "bralette"
order = 15
name = "Бралетт"
category = "lingerie"
category_label = "Бельё"
description = "Мягкий бюстгальтер без косточек: чашка из двух частей, пояс под грудью, бретели."
draft = "app.drafts.lingerie:build_bralette"
pieces = ["cup_lower", "cup_upper", "band", "strap"]
# Пол типовых фигур, для которых строится сетка ГОСТ; первый - по умолчанию.
genders = ["female"]
# Мерки основы: из них же собирается размерная сетка.
measurements = [
  "bust",
  "underbust",
  "height",
  "bust_center",
  "bust_height",
  "back_waist_length",
]

[source]
kind = "project"
method = "Упрощение проекта: ЕМКО СЭВ бельё не описывает"
notes = "Чашка из двух частей, размер чашки - разница груди и подгрудья."

[params.stretch]
type = "number"
default = 10
min = 0
max = 25
step = 0.5
unit = "%"

[params.band_height]
type = "number"
default = 4
min = 2
max = 8
step = 0.5
unit = "cm"

[params.strap_delta]
type = "number"
default = 0
min = -10
max = 10
step = 0.5
unit = "cm"

[[seams]]
a = ["cup_lower.шов чашки"]
b = ["cup_upper.шов чашки"]
