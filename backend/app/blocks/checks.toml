# Библиотека проверок «типовая ли основа». Паспорт основы включает нужные
# проверки в своём reference.toml и задаёт для них прибавку по методике.
#
# measure - что измерить на построенных деталях (см);
# expect  - что должно получиться по методике; e - прибавка из reference.toml,
#           проверка проходит, если measure лежит в [expect(e_min), expect(e_max)]
#           с допуском tolerance;
# range   - вместо expect: допустимый диапазон самого measure.
#
# Функции измерения: edge(деталь, срез) - длина среза; xmax/xmin/ymax/ymin
# (деталь, срез) - крайние координаты среза; width(деталь), height(деталь);
# girth(деталь, ...) - доля обхвата деталей; notch(деталь, подпись) - высота
# надсечки; width_at(деталь, y) - ширина детали на высоте y; cut(деталь) -
# сколько выкраивать; rise - подъём плечевой точки горловины над А0. Мерки ЕМКО: Sg, St, Sb, Ssh -
# полуобхваты груди, талии, бёдер, шеи; Dts - длина спины до талии; Vprz -
# высота проймы сзади; Di - длина изделия; Op - обхват плеча; m.* и p.* -
# мерки и параметры основы.

[neck_width_back]
title = "Ширина горловины спинки"
measure = "xmax('back', 'горловина')"
expect = "Ssh / 3 + e"
ease = [0.5, 1.0]
source = "ЕМКО СЭВ: А0А2 = Сш/3 + Пшгс"

[neck_height_back]
title = "Высота горловины спинки"
measure = "ymax('back', 'горловина') - ymin('back', 'горловина')"
expect = "xmax('back', 'горловина') / 3 + e"
ease = [0.0, 0.3]
source = "ЕМКО СЭВ: А2А1 = А0А2/3 + Пвгс"

[armhole_depth]
title = "Глубина проймы от седьмого шейного позвонка"
measure = "ymax('back', 'пройма') - ymax('back', 'горловина')"
expect = "Vprz + e"
ease = [1.5, 2.0]
source = "ЕМКО СЭВ: А0Г = Впрз + Пспр, отсчёт от точки А0 (середина горловины спинки)"

[back_length]
title = "Длина изделия по спинке от седьмого шейного позвонка"
measure = "ymax('back', 'бок') - ymax('back', 'горловина')"
expect = "Di + p.get('ease_length', 0) + p.get('length_delta', 0) + e"
ease = [0.0, 0.0]
tolerance = 1.0
source = "ГОСТ 31396/31399: длина изделия и длина спины до талии измеряются от седьмого шейного позвонка"

[bust_girth]
title = "Обхват по груди с прибавкой"
measure = "girth('front', 'back')"
expect = "2 * Sg + p.ease_bust + e"
ease = [0.0, 0.0]
source = "ЕМКО СЭВ: ширина сетки = Сг3 + Пг; прибавка задана к полному обхвату"

[shoulder_ease]
title = "Посадка плеча спинки"
measure = "edge('back', 'плечо') - edge('front', 'плечо')"
range = [0.5, 1.0]
source = "ЕМКО СЭВ: посадка по плечевому срезу спинки 0,5-1 см"

[sleeve_cap_ease]
title = "Посадка оката"
measure = "edge('sleeve', 'окат') - edge('front', 'пройма') - edge('back', 'пройма')"
range = [1.0, 2.0]
source = "ЕМКО СЭВ: посадка оката втачного рукава"

[hip_girth]
title = "Обхват по бёдрам с прибавкой"
measure = "width_at('front', notch('front', 'бёдра')) * cut('front') + width_at('back', notch('back', 'бёдра')) * cut('back')"
expect = "2 * Sb + p.ease_hip + e"
ease = [0.0, 0.0]
source = "ЕМКО СЭВ: ширина по линии бёдер = Сб + Пб; прибавка задана к полному обхвату"

[hip_ease]
title = "Прибавка по бёдрам (к полуобхвату)"
measure = "p.ease_hip / 2"
range = [1.0, 2.0]
source = "ЕМКО СЭВ: Пб юбки прямого силуэта 1-2 см"

[waist_ease]
title = "Прибавка по талии (к полуобхвату)"
measure = "p.ease_waist / 2"
range = [0.5, 1.0]
source = "ЕМКО СЭВ: Пт поясных изделий 0,5-1 см"

[crotch_depth]
title = "Глубина сидения"
measure = "ymax('front', 'средний') - ymin('front', 'средний')"
expect = "m.crotch_depth + e"
ease = [1.0, 1.5]
source = "ЕМКО СЭВ: линия шага ниже глубины сидения на 1-1,5 см"
