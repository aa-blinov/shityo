# Паспорт основы «Худи». Формулы - в app.drafts.knit.build_hoodie;
# порядок полей и значения - контракт с интерфейсом (docs/BLOCKS.md).

id = "hoodie"
order = 10
name = "Худи"
category = "tops"
category_label = "Трикотаж"
description = "Худи с капюшоном и карманом-кенгуру, притачные пояс и манжеты."
draft = "app.drafts.knit:build_hoodie"
pieces = ["front", "back", "sleeve", "waistband", "cuff", "hood", "pocket"]
# Пол типовых фигур, для которых строится сетка ГОСТ; первый - по умолчанию.
genders = ["male", "female"]
# Мерки основы: из них же собирается размерная сетка.
measurements = [
  "bust",
  "waist",
  "hip",
  "height",
  "shoulder_width",
  "shoulder_slope",
  "neck_to_waist",
  "waist_to_armpit",
  "waist_to_hip",
  "biceps",
  "back_length",
  "sleeve_length",
  "neck_circumference",
]

[source]
kind = "emko"
method = "ЕМКО СЭВ, т. II: основа плечевого изделия, упрощённая для трикотажа (почти прямой бок, без вытачек)"
notes = "Капюшон - vikisews.com/blog/kak-postroit-kapjushon; объёмное худи - vykroyka.com.ua."

[params.fit]
type = "select"
options = "fit"
default = "regular"

[params.pocket]
type = "select"
options = "pocket"
default = "kangaroo"

[params.hood_ease]
type = "number"
default = 4
min = 0
max = 12
step = 0.5
unit = "cm"

[params.sleeve_length]
type = "number"
default = "measurement"
min = 30
max = 95
step = 1
unit = "cm"

[params.length_delta]
type = "number"
default = 0
min = -30
max = 30
step = 1
unit = "cm"

[params.ease_bust]
type = "number"
default = 14
min = 0
max = 40
step = 0.5
unit = "cm"

[params.ease_length]
type = "number"
default = 2
min = 0
max = 20
step = 0.5
unit = "cm"

[params.band_width]
type = "number"
default = 7
min = 3
max = 12
step = 0.5
unit = "cm"

[params.cuff_width]
type = "number"
default = 7
min = 3
max = 12
step = 0.5
unit = "cm"

[[seams]]
a = ["sleeve.окат"]
b = ["front.пройма", "back.пройма"]
ease = [0, 50]
note = "посадка оката"

[[seams]]
a = ["front.плечо"]
b = ["back.плечо"]
ease = [-10, 0]
note = "посадка плеча спинки"

[[seams]]
a = ["front.бок"]
b = ["back.бок"]

[[seams]]
a = ["hood.горловина"]
b = ["front.горловина", "back.горловина"]
