# Паспорт основы «Платье-футляр». Формулы - в app.drafts.dress.build_dress;
# порядок полей и значения - контракт с интерфейсом (docs/BLOCKS.md).

id = "dress"
order = 4
name = "Платье-футляр"
category = "dresses"
category_label = "Платья"
description = "Базовое платье-футляр без рукавов с прилегающим силуэтом."
draft = "app.drafts.dress:build_dress"
pieces = ["front", "back"]
# Пол типовых фигур, для которых строится сетка ГОСТ; первый - по умолчанию.
genders = ["female"]
# Мерки основы: из них же собирается размерная сетка.
measurements = [
  "half_bust",
  "half_waist",
  "half_hip",
  "half_neck",
  "back_waist_length",
  "front_waist_length",
  "shoulder_length",
  "bust_height",
  "bust_center",
  "armhole_depth",
  "garment_length",
  "waist_to_hip",
]

[source]
kind = "emko"
method = "ЕМКО СЭВ, Единая методика конструирования одежды, т. II: основа плечевого изделия (лиф с вытачками)"
notes = "Платье-футляр: лиф продлён до низа, вытачки по талии, молния в боку."

[params.fit]
type = "select"
options = "fit"
default = "regular"

[params.length_delta]
type = "number"
default = 0
min = -30
max = 30
step = 1
unit = "cm"

[params.ease_bust]
type = "number"
default = 8
min = 0
max = 40
step = 0.5
unit = "cm"

[params.ease_waist]
type = "number"
default = 3
min = 0
max = 40
step = 0.5
unit = "cm"

[params.ease_hip]
type = "number"
default = 4
min = 0
max = 40
step = 0.5
unit = "cm"

[[seams]]
a = ["front.плечо"]
b = ["back.плечо"]
ease = [-10, 0]
note = "посадка плеча спинки"

[[seams]]
a = ["front.бок"]
b = ["back.бок"]
